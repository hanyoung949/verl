model:
  path: "~/share/Qwen2.5-3B-Instruct"

data:
  train_file: "verl/experimental/split_demo_v1/sample_data/train.jsonl"
  max_prompt_length: 256

split:
  # Qwen2.5-3B: 36 layers total
  # front  = layers[0:4]   -> 4 layers (edge)
  # middle = layers[4:32]  -> 28 layers (center)
  # tail   = layers[32:36] -> 4 layers (edge)
  front_end: 4
  middle_end: 32

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  target_modules: ["q_proj", "v_proj"]

rollout:
  group_size: 4
  max_new_tokens: 128
  temperature: 1.0
  top_p: 1.0

algorithm:
  norm_adv_by_std_in_grpo: false
  cliprange_low: 0.2
  cliprange_high: 0.28
  loss_agg_mode: "seq-mean-token-sum-norm"
  loss_scale_factor: 128
  dynamic_sampling: true
  update_epochs: 1
  mini_batch_size: 8

trainer:
  train_batch_size: 4
  total_steps: 10
  lr: 1.0e-4
  max_grad_norm: 1.0
  log_freq: 1
  log_gpu_memory: true
  log_transport: true
  save_dir: "verl/experimental/split_demo_v2/checkpoints"
  save_latest: true
  seed: 42
