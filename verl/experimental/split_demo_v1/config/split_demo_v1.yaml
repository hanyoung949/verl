model:
  # 当前目标场景：边侧算力受限，因此默认切到 3B，并把边侧前后段压到最小。
  # 注意：Qwen2.5-3B 一共 36 层，因此无法精确做 4:24:4，只能做最接近的 4:28:4。
  path: "~/share/Qwen2.5-3B-Instruct"

data:
  # 期望是 jsonl，每行至少包含 {"prompt": "...", "answer": "..."}
  # 默认使用仓库内的最小样本，便于直接做 smoke test。
  train_file: "verl/experimental/split_demo_v1/sample_data/train.jsonl"
  max_prompt_length: 256

split:
  # Qwen2.5-3B: 36 layers total
  # front  = layers[0:4]   -> 4 层（边侧）
  # middle = layers[4:32]  -> 28 层（中心）
  # tail   = layers[32:36] -> 4 层（边侧）
  front_end: 4
  middle_end: 32

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.0
  target_modules: ["q_proj", "v_proj"]

rollout:
  group_size: 4
  max_new_tokens: 128
  temperature: 1.0
  top_p: 1.0

algorithm:
  norm_adv_by_std_in_grpo: false
  cliprange_low: 0.2
  cliprange_high: 0.28
  loss_agg_mode: "seq-mean-token-sum-norm"
  loss_scale_factor: 128
  dynamic_sampling: true
  update_epochs: 1
  mini_batch_size: 8

trainer:
  train_batch_size: 4
  total_steps: 200
  lr: 1.0e-4
  max_grad_norm: 1.0
  log_freq: 10
  log_gpu_memory: true
  log_transport: true
  save_dir: "verl/experimental/split_demo_v1/checkpoints"
  save_latest: true
  seed: 42
